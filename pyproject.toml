[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tbank"
version = "1.0.2611"
description = "A time bank for communities: record time given and repay it through others."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
tbank = "tbank.cli:main"

[tool.setuptools.packages.find]
include = ["tbank*"]
